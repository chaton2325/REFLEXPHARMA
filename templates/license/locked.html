{% extends "base.html" %}

{% block title %}Abonnement expiré - ReflexPharma{% endblock %}

{% block extra_head %}
<style>
  .main-content { margin-left: 0 !important; }

  .locked-wrapper {
    min-height: calc(100vh - 6rem);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem;
  }
  @media (min-width: 768px) {
    .main-content { min-height: 100vh; }
    .main-content .container { max-width: none; width: 100%; padding: 0; margin: 0; }
    .main-content > footer { display: none; }
    .locked-wrapper { min-height: 100vh; }
  }

  .locked-card {
    width: 100%;
    max-width: 560px;
    background: linear-gradient(160deg, #2c1418 0%, #4a1f1f 55%, #6e2323 100%);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(110,35,35,0.35);
    padding: 3rem 2.5rem;
    text-align: center;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .locked-card::before {
    content: '';
    position: absolute;
    top: -35%;
    right: -15%;
    width: 260px;
    height: 260px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }
  .locked-icon {
    position: relative;
    z-index: 1;
    font-size: 3.4rem;
    color: #ff8a80;
    margin-bottom: 1rem;
    animation: locked-pulse 2.2s ease-in-out infinite;
  }
  @keyframes locked-pulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255,138,128,0)); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 16px rgba(255,138,128,0.5)); }
  }
  .locked-card h1 {
    position: relative;
    z-index: 1;
    font-weight: 700;
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
  }
  .locked-card p.locked-reason {
    position: relative;
    z-index: 1;
    color: rgba(255,255,255,0.85);
    margin-bottom: 1.75rem;
  }
  .locked-card .btn-reactivate {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: linear-gradient(135deg, #ffca28 0%, #ff9800 100%);
    color: #2c1418;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    padding: 0.85rem 1.75rem;
    box-shadow: 0 8px 24px rgba(255,152,0,0.35);
    text-decoration: none;
    animation: locked-btn-pulse 2.4s ease-in-out infinite;
  }
  @keyframes locked-btn-pulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(255,152,0,0.35); }
    50% { box-shadow: 0 8px 34px rgba(255,152,0,0.6); }
  }
  .locked-card .btn-reactivate:hover { opacity: 0.94; color: #2c1418; }

  .locked-card .locked-secondary {
    position: relative;
    z-index: 1;
    display: block;
    margin-top: 1.25rem;
    color: rgba(255,255,255,0.65);
    font-size: 0.85rem;
  }
  .locked-card .locked-secondary a { color: #ffca28; }
</style>
{% endblock %}

{% block content %}
<div class="locked-wrapper">
  <div class="locked-card">
    <i class="fas fa-lock locked-icon"></i>
    <h1>Accès bloqué</h1>
    <p class="locked-reason">{{ reason_label }}</p>
    <a href="{{ reactivate_url }}" target="_blank" rel="noopener" class="btn-reactivate">
      <i class="fas fa-rotate-right"></i> Réactiver mon abonnement
    </a>
    <span class="locked-secondary">
      J'ai déjà un nouveau code : <a href="{{ url_for('license.activate') }}">l'activer maintenant</a>
    </span>
  </div>
</div>
{% endblock %}
