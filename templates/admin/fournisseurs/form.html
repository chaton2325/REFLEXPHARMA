{% extends "base.html" %}

{% block title %}{{ title }} - ReflexPharma{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('admin.list_fournisseurs') }}">Fournisseurs</a></li>
                <li class="breadcrumb-item active">{{ title }}</li>
            </ol>
        </nav>
        
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0">{{ title }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nom du Fournisseur</label>
                            <input type="text" name="nom" id="fournisseurNom" class="form-control" value="{{ fournisseur.nom if fournisseur else '' }}" placeholder="ex: Laborex" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Préfixe Automatique</label>
                            <input type="text" name="prefixe" id="fournisseurPrefixe" class="form-control" value="{{ fournisseur.prefixe if fournisseur else '' }}" placeholder="ex: LAB1" maxlength="10" required>
                            <div class="form-text">Sera utilisé pour les codes produits. Modifiable manuellement.</div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Contact / Téléphone</label>
                        <input type="text" name="contact" class="form-control" value="{{ fournisseur.contact if fournisseur else '' }}" placeholder="Nom ou numéro de téléphone">
                    </div>

                    <script>
                    document.addEventListener('DOMContentLoaded', function() {
                        const nomInput = document.getElementById('fournisseurNom');
                        const prefixeInput = document.getElementById('fournisseurPrefixe');
                        
                        // On ne génère automatiquement que si on est en mode création (pas de préfixe déjà présent)
                        {% if not fournisseur %}
                        nomInput.addEventListener('input', function() {
                            let name = nomInput.value.trim();
                            if (name.length >= 2) {
                                // Prend les 3 premières lettres, en majuscules, sans caractères spéciaux
                                let base = name.substring(0, 3).toUpperCase().replace(/[^A-Z0-9]/g, '');
                                if (base.length > 0) {
                                    prefixeInput.value = base + "1";
                                }
                            } else if (name.length === 0) {
                                prefixeInput.value = "";
                            }
                        });
                        {% endif %}
                    });
                    </script>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Site Web</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-globe"></i></span>
                            <input type="url" name="site_web" class="form-control" value="{{ fournisseur.site_web if fournisseur else '' }}" placeholder="https://www.exemple.com">
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="mb-4">
                        <label class="form-label fw-bold">Groupe de Fournisseur</label>
                        <select name="groupe_id" id="groupeSelect" class="form-select">
                            <option value="">Aucun groupe</option>
                            {% for g in groupes %}
                            <option value="{{ g.id }}" {% if fournisseur and fournisseur.groupe_id == g.id %}selected{% endif %}>
                                {{ g.nom }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('admin.list_fournisseurs') }}" class="btn btn-light border">Annuler</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
